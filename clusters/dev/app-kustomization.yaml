apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./applications/base
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: app
  targetNamespace: lumina
  timeout: 3m0s
  wait: true
