---
apiVersion: v1
kind: Namespace
metadata:
  name: nfs
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfs-subdir-external-provisioner
  namespace: nfs
spec:
  interval: 1m0s
  timeout: 3m0s
  url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs-subdir-external-provisioner
  namespace: flux-system
spec:
  dependsOn:
  - name: flux-system
    namespace: flux-system
  interval: 1h0m0s
  path: ./clusters/dev/infra/networking/nfs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: nfs
  timeout: 3m0s
  wait: true
