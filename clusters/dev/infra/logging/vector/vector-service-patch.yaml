apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: lumina
spec:
  type: NodePort
  ports:
    - name: syslog-tcp
      port: 514
      targetPort: 514
      protocol: TCP
      nodePort: 30514
    - name: syslog-udp
      port: 514
      targetPort: 514
      protocol: UDP
      nodePort: 30515
