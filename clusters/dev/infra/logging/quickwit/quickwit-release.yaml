---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quickwit
  namespace: lumina
spec:
  chart:
    spec:
      chart: quickwit
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: quickwit-repo
  interval: 1m0s
  values:
    config:
      data_dir: /quickwit/qwdata
      default_index_root_uri: s3://default-bucket/indexes
      gossip_listen_port: 7282
      listen_address: 0.0.0.0
      metastore_uri: s3://default-bucket/metastore
      storage:
        s3:
          # Quickwit requires plain strings (reads node.yaml directly).
          # For production, inject via K8s Secret + init container:
          #   kubectl create secret generic garage-credentials \
          #     --from-literal=access_key_id="<GK...>" \
          #     --from-literal=secret_access_key="<hex...>" \
          #     -n lumina
          access_key_id: "CHANGE_ME_GARAGE_ACCESS_KEY"
          secret_access_key: "CHANGE_ME_GARAGE_SECRET_KEY"
          endpoint: http://YOUR_INFRA_IP:3900
          force_path_style_access: true
          region: garage
      version: 0.8

    searcher:
      replicaCount: 1
