---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  # Depends on the FULL infra chain (transitively: infra-services ->
  # infra-configs -> infra-controllers). By the time apps reconciles, the
  # external-secrets controller, cert-manager, and the NFS StorageClass are all
  # Ready, so the app ExternalSecrets, TLS Certificate, and PVCs bind cleanly.
  dependsOn:
    - name: infra-services
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: apps
  path: ./production
  prune: true
  wait: true
