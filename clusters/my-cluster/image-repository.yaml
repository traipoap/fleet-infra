apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: frontend
  namespace: flux-system
spec:
  image: ghcr.io/traipoap/frontend
  interval: 1m0s
  secretRef:
    name: app-git-secret
    
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: backend
  namespace: flux-system
spec:
  image: ghcr.io/traipoap/backend
  interval: 1m0s
  secretRef:
    name: app-git-secret
