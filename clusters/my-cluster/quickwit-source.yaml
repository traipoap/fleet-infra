---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: quickwit
  namespace: flux-system
spec:
  interval: 5m0s
  url: https://helm.quickwit.io/

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quickwit
  namespace: lumina
spec:
  interval: 5m
  chart:
    spec:
      chart: quickwit
      sourceRef:
        kind: HelmRepository
        name: quickwit
        namespace: flux-system

  values:
    config:
      version: 0.8
      listen_address: 0.0.0.0
      gossip_listen_port: 7282
      data_dir: /quickwit/qwdata
      default_index_root_uri: s3://default-bucket/indexes
      metastore_uri: "s3://default-bucket/metastore"
      storage:
        s3:
          endpoint: "http://192.168.1.4:3900"
          region: garage
          access_key_id: secrets
          secret_access_key: secrets
          force_path_style_access: true
