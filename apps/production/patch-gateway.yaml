apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gateway
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "app.traipoap.com"
    allowedRoutes:
      namespaces:
        from: "All"

  - name: https
    protocol: HTTPS
    port: 443
    hostname: "app.traipoap.com"
    tls:
      mode: Terminate
      certificateRefs:
      - name: app-traipoap-com-tls
        kind: Secret
    allowedRoutes:
      namespaces:
        from: All
