apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - name: ghcr.io/traipoap/backend
    newTag: "0.0.23" # {"$imagepolicy": "production:backend:tag"}
  - name: ghcr.io/traipoap/frontend
    newTag: "0.0.27" # {"$imagepolicy": "production:frontend:tag"}

patches:
  - target:
      kind: Gateway
      name: app-gateway
    path: patch-gateway.yaml

  - target:
      kind: ConfigMap
      name: app-config
    path: patch-config.yaml

  - target:
      kind: HTTPRoute
      name: app-httproute
    path: patch-httproute.yaml

  - target:
      kind: Certificate
      name: app-traipoap-com-tls
    path: patch-cert.yaml

namespace: production
