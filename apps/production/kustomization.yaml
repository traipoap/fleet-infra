apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - name: ghcr.io/traipoap/backend
    newTag: "0.0.23" # {"$imagepolicy": "production:backend:tag"}
  - name: ghcr.io/traipoap/frontend
    newTag: "0.0.27" # {"$imagepolicy": "production:frontend:tag"}

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1alpha3
      kind: Gateway
      name: app-gateway
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: app.traipoap.com

namespace: production
