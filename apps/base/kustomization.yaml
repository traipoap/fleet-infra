# Kustomize root - defines resources to bundle
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - configmap.yaml
  - gateway.yaml
  - httproute.yaml
  - backend-pvc.yaml
  - frontend-cert.yaml
  - jwt-external-secret.yaml
  - registry-external-secret.yaml
  - container-limits.yaml
namespace: base

patches:
  - target:
      kind: Deployment
      name: app-gateway
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app-gateway
      spec:
        template:
          spec:
            containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 5m
                  memory: 50Mi
                limits:
                  cpu: 10m
                  memory: 100Mi
