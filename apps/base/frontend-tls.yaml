apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frontend-tls
spec:
  # Name of the Secret where cert-manager stores the issued certificate and key.
  # The Gateway's tls.certificateRefs must reference this same Secret
  # (see gateway.yaml; note it currently points at "frontend-tls").
  secretName: app-codezap-win-tls
  dnsNames:
  - "app.codezap.win"
  # Name ref: points to the ClusterIssuer "cluster-ca-issuer",
  # declared in infrastructure/configs/cert-manager/ca-issuer.yaml
  # (applied by the infra-configs Kustomization, before this one).
  issuerRef:
    name: cluster-ca-issuer
    kind: ClusterIssuer
