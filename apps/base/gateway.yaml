apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gateway
  annotations:
    # Name ref: value must be the name of a ClusterIssuer.
    # The CA issuer is named "cluster-ca-issuer" (infrastructure/configs/cert-manager/ca-issuer.yaml);
    # "cluster-ca" is only the name of the CA Certificate itself.
    cert-manager.io/cluster-issuer: "cluster-ca"
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "app.codezap.win"
    allowedRoutes:
      namespaces:
        from: "All"

  - name: https
    protocol: HTTPS
    port: 443
    hostname: "app.codezap.win"
    tls:
      mode: Terminate
      # Name ref: name of the Secret holding the TLS certificate (Gateway's namespace).
      # Should match spec.secretName in frontend-tls.yaml ("app-codezap-win-tls").
      certificateRefs:
      - name: app-codezap-win-tls
        kind: Secret
    allowedRoutes:
      namespaces:
        from: All
