apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lumina
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4321"
    spec:
      imagePullSecrets:
        - name: github-registry
      containers:
        - name: frontend
          image: 'ghcr.io/traipoap/frontend:0.0.37' # {"$imagepolicy": "flux-system:frontend-policy"}
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lumina-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
