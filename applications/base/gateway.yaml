apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: frontend-gateway
  namespace: lumina
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "*"
    allowedRoutes:
      namespaces:
        from: "All"

  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*"
    tls:
      mode: Terminate
      certificateRefs:
      - name: selfsigned-cert
    allowedRoutes:
      namespaces:
        from: "All"
