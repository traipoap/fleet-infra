---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: git-repo
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/traipoap/fleet-infra.git
  secretRef:
    name: app-git-secret

---
# Step 1: Install cert-manager (HelmRepository + HelmRelease)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./sources/cert-manager-repo.yaml
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: git-repo
    namespace: flux-system
  timeout: 5m0s
  wait: true

---
# Step 2: Apply ClusterIssuers — waits for cert-manager CRDs to be ready
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  dependsOn:
  - name: cert-manager
    namespace: flux-system
  interval: 30m0s
  path: ./infrastructure/security/cert-manager
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: git-repo
    namespace: flux-system
  timeout: 3m0s
  wait: true

---
# Step 3: Deploy app — waits for ClusterIssuers to be ready
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  dependsOn:
  - name: cert-manager-config
    namespace: flux-system
  interval: 30m0s
  path: ./applications/base
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: git-repo
    namespace: flux-system
  targetNamespace: lumina
  timeout: 3m0s
  wait: true
