apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

spec:
  chart:
    spec:
      chart: quickwit

  values:
    config:
      version: 0.8
      listen_address: 0.0.0.0
      gossip_listen_port: 7282
      data_dir: /quickwit/qwdata
      default_index_root_uri: s3://default-bucket/indexes
      metastore_uri: "s3://default-bucket/metastore"

      storage:
        s3:
          endpoint: "http://192.168.1.4:3900"
          region: garage
          access_key_id: YOUR_GARAGE_ACCESS_KEY
          secret_access_key: YOUR_GARAGE_SECRET_KEY
          force_path_style_access: true
