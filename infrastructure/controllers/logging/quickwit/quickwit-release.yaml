---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quickwit
  namespace: lumina
spec:
  chart:
    spec:
      chart: quickwit
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: quickwit-repo
  interval: 1m0s
  values:
    config:
      data_dir: /quickwit/qwdata
      default_index_root_uri: s3://default-bucket/indexes
      gossip_listen_port: 7282
      listen_address: 0.0.0.0
      metastore_uri: s3://default-bucket/metastore
      storage:
        s3:
          access_key_id: $GARAGE_DEFAULT_ACCESS_KEY
          secret_access_key: $GARAGE_DEFAULT_SECRET_KEY
          endpoint: http://$GARAGE_ENDPOINT
          force_path_style_access: true
          region: garage
      version: 0.8

    searcher:
      replicaCount: 1
