---
apiVersion: v1
kind: Namespace
metadata:
  name: lumina

---
apiVersion: source.toolkit.fluxcd.io/v2
kind: HelmRepository
metadata:
  name: quickwit
  namespace: lumina
spec:
  interval: 30m0s
  url: https://quickwit-oss.github.io/helm-charts/

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quickwit
  namespace: lumina
spec:
  interval: 30m0s
  chart:
    spec:
      chart: quickwit
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: quickwit
        namespace: lumina
