---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1m0s
  type: oci
  url: oci://quay.io/jetstack/charts
---
  apiVersion: helm.toolkit.fluxcd.io/v2
  kind: HelmRelease
  metadata:
    name: cert-manager
    namespace: flux-system
  spec:
    chart:
      spec:
        chart: cert-manager
        reconcileStrategy: ChartVersion
        sourceRef:
          kind: HelmRepository
          name: cert-manager
          namespace: flux-system
        version: 1.12.1
    install:
      createNamespace: true
    interval: 1m0s
    releaseName: cert-manager
    storageNamespace: cert-manager
    targetNamespace: cert-manager
    values:
      crds:
        enabled: true
