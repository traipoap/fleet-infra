apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nfs-external-secret
  namespace: nfs
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: secretstore-aws
    kind: ClusterSecretStore
  target:
    name: nfs-subdir-external-provisioner
    creationPolicy: Owner
    template:
      type: helm.toolkit.fluxcd.io/v2
      data:
        patch.yaml: |
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: nfs-subdir-external-provisioner
          spec:
            values:
              nfs:
                server: "{{ .server }}"
                path: "{{ .path }}"
  data:
  - secretKey: server
    remoteRef:
      key: dev/nfs/server
      property: SERVER

  - secretKey: path
    remoteRef:
      key: dev/nfs/server
      property: PATH
