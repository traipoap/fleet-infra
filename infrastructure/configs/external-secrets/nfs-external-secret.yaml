---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nfs-provisioner-values
  namespace: nfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secretstore-aws
    kind: ClusterSecretStore
  target:
    name: nfs-provisioner-secret-values
    template:
      engineVersion: v2
      data:
        # ขึ้นโครงสร้าง YAML สำหรับ Helm values
        values.yaml: |
          nfs:
            server: "{{ .server }}"
            path: "{{ .path }}"
  data:
    - secretKey: server
      remoteRef:
        key: dev/nfs/config
        property: server
    - secretKey: path
      remoteRef:
        key: dev/nfs/config
        property: path
