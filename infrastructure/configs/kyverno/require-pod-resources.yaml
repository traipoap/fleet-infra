apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-resources
spec:
  validationFailureAction: Audit # โหมดตรวจสอบอย่างเดียว ไม่บล็อกการ Deploy
  background: true
  rules:
  - name: validate-resource-limits
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - istio-system
          - kyverno
          - logging
          - flux-system
    validate:
      message: "ต้องกำหนด resources.requests และ resources.limits (cpu, memory) ใน Pod ทุกครั้ง"
      pattern:
        spec:
          containers:
          - resources:
              requests:
                cpu: "?*"
                memory: "?*"
              limits:
                cpu: "?*"
                memory: "?*"
