---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: quickwit-repo
  namespace: lumina
spec:
  interval: 1m0s
  timeout: 3m0s
  url: https://helm.quickwit.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quickwit
  namespace: lumina
spec:
  chart:
    spec:
      chart: quickwit
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: quickwit-repo
  interval: 1m0s
  values:
    config:
      data_dir: /quickwit/qwdata
      default_index_root_uri: s3://default-bucket/indexes
      gossip_listen_port: 7282
      listen_address: 0.0.0.0
      metastore_uri: s3://default-bucket/metastore
      storage:
        s3:
          access_key_id: YOUR_GARAGE_ACCESS_KEY
          endpoint: http://192.168.1.4:3900
          force_path_style_access: true
          region: garage
          secret_access_key: YOUR_GARAGE_SECRET_KEY
      version: 0.8
