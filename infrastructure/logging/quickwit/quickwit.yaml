apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickwit-control-plane
  labels:
    helm.sh/chart: quickwit-0.8.12
    app.kubernetes.io/name: quickwit
    app.kubernetes.io/instance: quickwit
    app.kubernetes.io/version: "v0.8.2"
    app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quickwit
      app.kubernetes.io/instance: quickwit
      app.kubernetes.io/component: control-plane
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: 816af5213d5f83a893136606ed19b5c04cb6fe2bad31dbc0e24fe77ac60c2ecf
      labels:

        app.kubernetes.io/name: quickwit
        app.kubernetes.io/instance: quickwit
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: quickwit
      securityContext:
        fsGroup: 1005
      containers:
        - name: quickwit
          securityContext:
            runAsNonRoot: true
            runAsUser: 1005
          image: "quickwit/quickwit:v0.8.2"
          imagePullPolicy: IfNotPresent
          args: ["run", "--service", "control_plane"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: QW_CONFIG
              value: /quickwit/node.yaml
            - name: QW_CLUSTER_ID
              value: lumina-quickwit
            - name: QW_NODE_ID
              value: "$(POD_NAME)"
            - name: QW_PEER_SEEDS
              value: quickwit-headless
            - name: QW_ADVERTISE_ADDRESS
              value: "$(POD_IP)"
            - name: QW_CLUSTER_ENDPOINT
              value: http://quickwit-metastore.lumina.svc.cluster.local:7280
          ports:
            - name: rest
              containerPort: 7280
              protocol: TCP
            - name: grpc
              containerPort: 7281
              protocol: TCP
            - name: discovery
              containerPort: 7282
              protocol: UDP
          startupProbe:
            failureThreshold: 12
            httpGet:
              path: /health/livez
              port: rest
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/livez
              port: rest
          readinessProbe:
            httpGet:
              path: /health/readyz
              port: rest
          volumeMounts:
            - name: config
              mountPath: /quickwit/node.yaml
              subPath: node.yaml
            - name: data
              mountPath: /quickwit/qwdata
          resources:
            {}
      volumes:
        - name: config
          configMap:
            name: quickwit
            items:
              - key: node.yaml
                path: node.yaml
        - name: data
          emptyDir: {}
      tolerations:
        []
