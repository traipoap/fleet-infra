apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: istio-system
resources:
  - https://raw.githubusercontent.com/istio/istio/release-1.30/samples/addons/grafana.yaml

patches:
  # Patch the Grafana Deployment to install the Quickwit Plugin
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GF_INSTALL_PLUGINS
          value: "https://github.com/quickwit-oss/quickwit-datasource/releases/download/v0.6.3/quickwit-quickwit-datasource-0.6.3.zip;quickwit-quickwit-datasource"

  - target:
      kind: ConfigMap
      name: grafana
    patch: |-
      - op: add
        path: /data/datasources.yaml
        value:
          - access: proxy
            editable: true
            isDefault: true
            jsonData:
              timeInterval: 15s
            name: Prometheus
            orgId: 1
            type: prometheus
            url: http://prometheus:9090
          - access: proxy
            editable: true
            isDefault: false
            jsonData:
              timeInterval: 5s
            name: Loki
            orgId: 1
            type: loki
            url: http://loki:3100
          - name: Quickwit Logs
            type: quickwit-quickwit-datasource
            url: http://quickwit-searcher.lumina.svc.cluster.local:7280/api/v1
            jsonData:
              index: 'logs'
              logMessageField: message
              logLevelField: severity_text
